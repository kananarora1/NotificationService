global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alert rules live alongside this file; docker-compose mounts the whole directory
# into /etc/prometheus. View them at http://localhost:9090/alerts.
rule_files:
  - /etc/prometheus/alerts.yml

# Optional: to actually route these somewhere (email/Slack/PagerDuty), run an
# Alertmanager and uncomment the block below. Not required — the rules are fully
# visible in the Prometheus UI without it.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      # The app runs on the host; scrape both instances (8081 is DOWN until you start it).
      - targets: ["host.docker.internal:8080"]
        labels:
          instance_name: app-8080
      - targets: ["host.docker.internal:8081"]
        labels:
          instance_name: app-8081
