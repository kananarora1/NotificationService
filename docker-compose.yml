services:
  postgres:
    image: postgres:16
    container_name: notification-postgres
    environment:
      # Values come from .env, which docker compose reads from this directory
      # automatically. The ":-" fallbacks keep a bare `docker compose up` working for
      # local development; deployed environments must set them explicitly.
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      POSTGRES_USER: ${DB_USERNAME:-notifications}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notifications}
    # Host port defaults to 5433 to avoid colliding with a native Postgres on 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notification-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # AMQP protocol port
      - "${RABBITMQ_PORT:-5672}:5672"
      # Management UI: http://localhost:15672
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - notification-rabbitmq:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    # Shared store for the distributed rate limiter (v7).
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - notification-redis:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: notification-prometheus
    # Scrapes the app's /actuator/prometheus every 5s (see observability/prometheus/prometheus.yml).
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container reach the app running on the host (both 8080 and 8081).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: notification-grafana
    # Auto-provisioned with the Prometheus datasource + a dashboard, so it works on first boot.
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - notification-grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  notification-pgdata:
  notification-rabbitmq:
  notification-redis:
  notification-grafana:
