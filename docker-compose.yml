services:
  postgres:
    image: postgres:16
    container_name: notification-postgres
    # Generous window to let Postgres finish its shutdown checkpoint rather than be SIGKILLed.
    stop_grace_period: 60s
    environment:
      # Values come from .env, which docker compose reads from this directory
      # automatically. The ":-" fallbacks keep a bare `docker compose up` working for
      # local development; deployed environments must set them explicitly.
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      POSTGRES_USER: ${DB_USERNAME:-notifications}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notifications}
    # Host port defaults to 5433 to avoid colliding with a native Postgres on 5432.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notification-rabbitmq
    # Generous window to let RabbitMQ flush its message store rather than be SIGKILLed.
    stop_grace_period: 60s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # AMQP protocol port
      - "${RABBITMQ_PORT:-5672}:5672"
      # Management UI: http://localhost:15672
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - notification-rabbitmq:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    # Shared store for the distributed rate limiter (v7).
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - notification-redis:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: notification-prometheus
    # Scrapes the app's /actuator/prometheus every 5s (see observability/prometheus/prometheus.yml).
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # Whole directory, not just prometheus.yml, so alerts.yml is mounted too.
      - ./observability/prometheus:/etc/prometheus:ro
    extra_hosts:
      # Lets the container reach the app running on the host (both 8080 and 8081).
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: [alerts]
    container_name: notification-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - notification-alertmanager:/alertmanager
    secrets:
      - alertmanager_gmail_app_password

  grafana:
    image: grafana/grafana:latest
    container_name: notification-grafana
    # Auto-provisioned with the Prometheus datasource + a dashboard, so it works on first boot.
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - notification-grafana:/var/lib/grafana
    depends_on:
      - prometheus

# ---------------------------------------------------------------------------
# The app itself runs on the HOST (`./mvnw spring-boot:run`), so there is no app
# container here to give a stop_grace_period to. When you do containerize it, the
# service needs to look like this — Docker sends SIGTERM, waits stop_grace_period,
# then SIGKILLs, so that window must exceed the app's own shutdown budget:
#
#   app:
#     build: .
#     container_name: notification-app
#     # 30s per shutdown phase (spring.lifecycle.timeout-per-shutdown-phase) x2 phases
#     # (HTTP drain, then listener drain) + headroom. Too low and Docker kills the JVM
#     # mid-drain, which is exactly the redelivery the graceful shutdown prevents.
#     stop_grace_period: 90s
#     environment:
#       DB_URL: jdbc:postgresql://postgres:5432/notifications
#       RABBITMQ_HOST: rabbitmq
#       REDIS_HOST: redis
#     depends_on: [postgres, rabbitmq, redis]
#     ports:
#       - "${SERVER_PORT:-8080}:8080"
# ---------------------------------------------------------------------------

volumes:
  notification-pgdata:
  notification-rabbitmq:
  notification-redis:
  notification-grafana:
  notification-alertmanager:

secrets:
  alertmanager_gmail_app_password:
    file: ./.secrets/alertmanager-gmail-app-password
