services:
  postgres:
    image: postgres:16
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    # Host port is 5433 to avoid colliding with a native Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notification-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # AMQP protocol port
      - "5672:5672"
      # Management UI: http://localhost:15672 (guest/guest)
      - "15672:15672"
    volumes:
      - notification-rabbitmq:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    # Shared store for the distributed rate limiter (v7).
    ports:
      - "6379:6379"
    volumes:
      - notification-redis:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: notification-prometheus
    # Scrapes the app's /actuator/prometheus every 5s (see observability/prometheus/prometheus.yml).
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container reach the app running on the host (both 8080 and 8081).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: notification-grafana
    # Auto-provisioned with the Prometheus datasource + a dashboard, so it works on first boot.
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - notification-grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  notification-pgdata:
  notification-rabbitmq:
  notification-redis:
  notification-grafana:
