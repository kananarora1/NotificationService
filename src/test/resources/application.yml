# Test configuration. Postgres and RabbitMQ connection details are supplied at
# runtime by Testcontainers (@ServiceConnection); only the bits that differ from
# those defaults live here.
spring:
  # Tests get their schema from Flyway too, exactly like production — so the
  # migrations are exercised on every test run rather than only in deployment.
  # The Testcontainers database starts empty, so V1 runs from scratch (no baselining).
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # validate, not create-drop: the entities are checked against the
      # Flyway-built schema. A migration that drifts from the entities fails the tests.
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      # Matches production; host/port come from the Redis container.
      timeout: 200ms
  rabbitmq:
    listener:
      simple:
        concurrency: 4
        prefetch: 1
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        notifications.delivery.latency: true
        notifications.end_to_end.latency: true
