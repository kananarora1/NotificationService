# Test configuration. Postgres and RabbitMQ connection details are supplied at
# runtime by Testcontainers (@ServiceConnection); only the bits that differ from
# those defaults live here.
spring:
  # Tests get their schema from Flyway too, exactly like production — so the
  # migrations are exercised on every test run rather than only in deployment.
  # The Testcontainers database starts empty, so V1 runs from scratch (no baselining).
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # validate, not create-drop: the entities are checked against the
      # Flyway-built schema. A migration that drifts from the entities fails the tests.
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      # Matches production; host/port come from the Redis container.
      timeout: 200ms
  rabbitmq:
    listener:
      simple:
        concurrency: 4
        prefetch: 1
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

# src/test/resources/application.yml fully replaces the main one on the test classpath,
# so the seeded tenants have to be declared here too. Same keys the docs and tests use;
# only their SHA-256 hashes are stored.
notifications:
  reconciler:
    # Production lease, so nothing a test has genuinely in flight is ever reclaimed;
    # tests expire a lease by backdating claimed_at instead of waiting 60s.
    lease-timeout: 60s
    # Fast sweep, so a test that expires a lease sees the scheduled reconciler act
    # within a second rather than calling it by hand.
    sweep-interval: PT1S
    batch-size: 100
  seeding:
    enabled: true
    tenants:
      - name: acme
        api-key: key-acme
        rate-limit-per-minute: 60
      - name: globex
        api-key: key-globex
        rate-limit-per-minute: 10
      - name: initech
        api-key: key-initech
        rate-limit-per-minute: 5

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        notifications.delivery.latency: true
        notifications.end_to_end.latency: true
