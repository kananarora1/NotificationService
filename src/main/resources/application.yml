spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5433/notifications
    username: notifications
    password: notifications
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema predates Flyway (it was built by ddl-auto: update), so an existing
    # database has tables but no flyway_schema_history. baseline-on-migrate creates
    # that history on first run; baseline-version 1 stamps it at V1, so V1 is recorded
    # as already applied and never re-executed against the populated database.
    # An empty database skips baselining entirely and runs V1 from scratch.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing ddl-auto schema"
  jpa:
    hibernate:
      # validate, not update: Hibernate checks that the entities match the
      # Flyway-managed schema and fails startup on drift, but never alters the schema
      # itself. Schema changes go in a new src/main/resources/db/migration/V<n>__*.sql.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      # Cap the rate-limiter's Redis call. Without this, Lettuce's 60s default means a
      # hung (not refused) Redis pins a Tomcat thread for a minute before the
      # limiter's fail-open path is reached.
      timeout: 200ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 16
        max-concurrency: 32
        prefetch: 10
        acknowledge-mode: auto
        default-requeue-rejected: false   # exhausted retries are dead-lettered, not requeued
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000   # 1s before the first retry
          multiplier: 2.0          # then 2s, 4s, ...
          max-interval: 10000      # capped at 10s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: notification-service
    distribution:
      # Publish histogram buckets so Prometheus/Grafana can compute p50/p95/p99.
      percentiles-histogram:
        http.server.requests: true
        notifications.delivery.latency: true
        notifications.end_to_end.latency: true