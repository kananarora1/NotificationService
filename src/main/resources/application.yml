spring:
  application:
    name: notification-service
  task:
    scheduling:
      pool:
        # One thread per @Scheduled task, not Boot's default of one for all: LeaseReconciler's
        # sweep and MetricsPoller's database and queue polls. On a shared thread a hung sweep
        # would also freeze the gauges — including notifications.stuck_sending, the one that
        # detects a hung sweep — and while Postgres hangs, the database poll would hold up
        # the parking-lot depth that should be alerting.
        size: 3
  lifecycle:
    # Budget for EACH SmartLifecycle shutdown phase (the web server's drain and the
    # RabbitMQ listener's drain are separate phases, so worst case is roughly two of
    # these back to back). Must stay below the container's stop_grace_period, or
    # Docker SIGKILLs mid-drain — see docker-compose.yml.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    # Every credential comes from the environment. The defaults after ':' are the
    # local docker-compose values and are deliberately non-secret — a real deployment
    # supplies DB_URL/DB_USERNAME/DB_PASSWORD and never falls through to them.
    # See .env.example for the full list.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notifications}
    username: ${DB_USERNAME:notifications}
    password: ${DB_PASSWORD:notifications}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema predates Flyway (it was built by ddl-auto: update), so an existing
    # database has tables but no flyway_schema_history. baseline-on-migrate creates
    # that history on first run; baseline-version 1 stamps it at V1, so V1 is recorded
    # as already applied and never re-executed against the populated database.
    # An empty database skips baselining entirely and runs V1 from scratch.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing ddl-auto schema"
  jpa:
    hibernate:
      # validate, not update: Hibernate checks that the entities match the
      # Flyway-managed schema and fails startup on drift, but never alters the schema
      # itself. Schema changes go in a new src/main/resources/db/migration/V<n>__*.sql.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Cap the rate-limiter's Redis call. Without this, Lettuce's 60s default means a
      # hung (not refused) Redis pins a Tomcat thread for a minute before the
      # limiter's fail-open path is reached.
      timeout: 200ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Bounds a publish against a broker that is unreachable but not refusing (amqp-client
    # waits 60s by default). create() publishes on the request thread, so this caps how
    # long a POST can hang on RabbitMQ before it answers 202 and leaves the row for the
    # reconciler.
    connection-timeout: 5s
    # A publish counts only once the broker acks it (confirms) and routed it to a queue
    # (mandatory + returns) — see NotificationPublisher. Without these an unroutable or
    # dropped message is indistinguishable from a delivered one.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 16
        max-concurrency: 32
        prefetch: 10
        acknowledge-mode: auto
        default-requeue-rejected: false   # exhausted retries are dead-lettered, not requeued
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000   # 1s before the first retry
          multiplier: 2.0          # then 2s, 4s, ...
          max-interval: 10000      # capped at 10s

server:
  port: ${SERVER_PORT:8080}
  # Stop accepting new connections on SIGTERM, then let in-flight HTTP requests
  # finish before the connector closes. Bounded by
  # spring.lifecycle.timeout-per-shutdown-phase below.
  shutdown: graceful

notifications:
  brevo:
    # This real provider is enabled only by the explicit prod or brevo profile. Local development
    # and tests keep the simulated provider, so these values deliberately have no secret fallback.
    api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:RelayNest Notifications}
    reply-to-email: ${BREVO_REPLY_TO_EMAIL:}
    subject: ${BREVO_EMAIL_SUBJECT:RelayNest notification}
    webhook-username: ${BREVO_WEBHOOK_USERNAME:}
    webhook-password: ${BREVO_WEBHOOK_PASSWORD:}
  listener:
    # How long the RabbitMQ listener containers may spend draining in-flight and
    # prefetched messages on shutdown. Keep below timeout-per-shutdown-phase (30s).
    shutdown-timeout: ${LISTENER_SHUTDOWN_TIMEOUT:25s}
  publisher:
    # How long a publish waits for the broker's confirm before it is treated as failed and
    # left to the reconciler. Keep connection-timeout + this below reconciler.publish-grace.
    confirm-timeout: ${PUBLISHER_CONFIRM_TIMEOUT:5s}
  reconciler:
    # A SENDING claim older than this is presumed abandoned (its consumer died) and is
    # returned to PENDING and republished. It covers one provider call, not the retry
    # cycle, so it only has to clear the slowest single send (~800ms here) with margin.
    lease-timeout: ${RECONCILER_LEASE_TIMEOUT:60s}
    # Fixed delay between sweeps. ISO-8601 (PT30S) or plain milliseconds: @Scheduled in
    # Spring 6.1 does not accept the "30s" shorthand the other durations here use.
    sweep-interval: ${RECONCILER_SWEEP_INTERVAL:PT30S}
    batch-size: 100
    # An unpublished PENDING row younger than this is left alone: its create() may still
    # be publishing it. Must exceed connection-timeout + publisher.confirm-timeout (10s).
    publish-grace: ${RECONCILER_PUBLISH_GRACE:15s}
    # A PENDING row that has used up its retries (attempts >= retry.max-attempts) and
    # whose last attempt began longer ago than this is marked DEAD by the reconciler: its
    # dead-letter handler could not write DEAD. Must exceed one provider call plus the
    # dead-letter retry below (~1.5s), so the handler normally records it first.
    dead-grace: ${RECONCILER_DEAD_GRACE:60s}
  dead-letter:
    # The notifications.dlq listener's own retry, separate from the work queue's (see
    # RabbitConfig.deadLetterContainerFactory). After the last attempt the message is
    # parked in notifications.parking-lot, never dropped. Kept short: these attempts
    # mostly fail together, during a Postgres outage.
    retry:
      max-attempts: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 2s
  seeding:
    # Local-development convenience: ensures these tenants exist on startup, storing
    # only the SHA-256 hash of each key. Set SEED_TENANTS_ENABLED=false in production
    # and provision tenants deliberately (see "Adding a tenant" in the README).
    enabled: ${SEED_TENANTS_ENABLED:true}
    tenants:
      - name: acme
        api-key: ${ACME_API_KEY:key-acme}
        rate-limit-per-minute: ${ACME_RATE_LIMIT:60}
      - name: globex
        api-key: ${GLOBEX_API_KEY:key-globex}
        rate-limit-per-minute: ${GLOBEX_RATE_LIMIT:10}
      - name: initech
        api-key: ${INITECH_API_KEY:key-initech}
        rate-limit-per-minute: ${INITECH_RATE_LIMIT:5}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: notification-service
    distribution:
      # Publish histogram buckets so Prometheus/Grafana can compute p50/p95/p99.
      percentiles-histogram:
        http.server.requests: true
        notifications.delivery.latency: true
        notifications.end_to_end.latency: true
