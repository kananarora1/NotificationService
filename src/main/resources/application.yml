spring:
  application:
    name: notification-service
  task:
    scheduling:
      pool:
        # Two threads, not Boot's default of one: MetricsPoller and LeaseReconciler are
        # both @Scheduled. On one thread a hung sweep would also freeze the gauges —
        # including notifications.stuck_sending, the one that detects a hung sweep.
        size: 2
  lifecycle:
    # Budget for EACH SmartLifecycle shutdown phase (the web server's drain and the
    # RabbitMQ listener's drain are separate phases, so worst case is roughly two of
    # these back to back). Must stay below the container's stop_grace_period, or
    # Docker SIGKILLs mid-drain — see docker-compose.yml.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    # Every credential comes from the environment. The defaults after ':' are the
    # local docker-compose values and are deliberately non-secret — a real deployment
    # supplies DB_URL/DB_USERNAME/DB_PASSWORD and never falls through to them.
    # See .env.example for the full list.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notifications}
    username: ${DB_USERNAME:notifications}
    password: ${DB_PASSWORD:notifications}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema predates Flyway (it was built by ddl-auto: update), so an existing
    # database has tables but no flyway_schema_history. baseline-on-migrate creates
    # that history on first run; baseline-version 1 stamps it at V1, so V1 is recorded
    # as already applied and never re-executed against the populated database.
    # An empty database skips baselining entirely and runs V1 from scratch.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing ddl-auto schema"
  jpa:
    hibernate:
      # validate, not update: Hibernate checks that the entities match the
      # Flyway-managed schema and fails startup on drift, but never alters the schema
      # itself. Schema changes go in a new src/main/resources/db/migration/V<n>__*.sql.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Cap the rate-limiter's Redis call. Without this, Lettuce's 60s default means a
      # hung (not refused) Redis pins a Tomcat thread for a minute before the
      # limiter's fail-open path is reached.
      timeout: 200ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 16
        max-concurrency: 32
        prefetch: 10
        acknowledge-mode: auto
        default-requeue-rejected: false   # exhausted retries are dead-lettered, not requeued
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000   # 1s before the first retry
          multiplier: 2.0          # then 2s, 4s, ...
          max-interval: 10000      # capped at 10s

server:
  port: ${SERVER_PORT:8080}
  # Stop accepting new connections on SIGTERM, then let in-flight HTTP requests
  # finish before the connector closes. Bounded by
  # spring.lifecycle.timeout-per-shutdown-phase below.
  shutdown: graceful

notifications:
  listener:
    # How long the RabbitMQ listener containers may spend draining in-flight and
    # prefetched messages on shutdown. Keep below timeout-per-shutdown-phase (30s).
    shutdown-timeout: ${LISTENER_SHUTDOWN_TIMEOUT:25s}
  reconciler:
    # A SENDING claim older than this is presumed abandoned (its consumer died) and is
    # returned to PENDING and republished. It covers one provider call, not the retry
    # cycle, so it only has to clear the slowest single send (~800ms here) with margin.
    lease-timeout: ${RECONCILER_LEASE_TIMEOUT:60s}
    # Fixed delay between sweeps. ISO-8601 (PT30S) or plain milliseconds: @Scheduled in
    # Spring 6.1 does not accept the "30s" shorthand the other durations here use.
    sweep-interval: ${RECONCILER_SWEEP_INTERVAL:PT30S}
    batch-size: 100
  seeding:
    # Local-development convenience: ensures these tenants exist on startup, storing
    # only the SHA-256 hash of each key. Set SEED_TENANTS_ENABLED=false in production
    # and provision tenants deliberately (see "Adding a tenant" in the README).
    enabled: ${SEED_TENANTS_ENABLED:true}
    tenants:
      - name: acme
        api-key: ${ACME_API_KEY:key-acme}
        rate-limit-per-minute: ${ACME_RATE_LIMIT:60}
      - name: globex
        api-key: ${GLOBEX_API_KEY:key-globex}
        rate-limit-per-minute: ${GLOBEX_RATE_LIMIT:10}
      - name: initech
        api-key: ${INITECH_API_KEY:key-initech}
        rate-limit-per-minute: ${INITECH_RATE_LIMIT:5}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: notification-service
    distribution:
      # Publish histogram buckets so Prometheus/Grafana can compute p50/p95/p99.
      percentiles-histogram:
        http.server.requests: true
        notifications.delivery.latency: true
        notifications.end_to_end.latency: true