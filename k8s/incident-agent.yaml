apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-agent-config
  namespace: notification-service
data:
  INCIDENT_NAMESPACE: notification-service
  PROMETHEUS_URL: http://prometheus:9090
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USER: arorakanan63@gmail.com
  SMTP_SENDER: arorakanan63@gmail.com
  SMTP_RECIPIENT: arorakanan63@gmail.com
  SMTP_PASSWORD_FILE: /run/secrets/gmail/alertmanager_gmail_app_password
  WEBHOOK_TOKEN_FILE: /run/secrets/webhook/token
  INCIDENT_MODEL_URL: http://ollama:11434/api/chat
  INCIDENT_MODEL_NAME: gemma3:1b
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-agent
  namespace: notification-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-agent-reader
  namespace: notification-service
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-agent-reader
  namespace: notification-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-agent-reader
subjects:
  - kind: ServiceAccount
    name: incident-agent
    namespace: notification-service
---
apiVersion: v1
kind: Service
metadata:
  name: incident-agent
  namespace: notification-service
spec:
  selector:
    app.kubernetes.io/name: incident-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
