apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: notification-service
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: arorakanan63@gmail.com
      smtp_auth_username: arorakanan63@gmail.com
      smtp_auth_password_file: /run/secrets/alertmanager_gmail_app_password
      smtp_require_tls: true
    route:
      receiver: discard
      group_by: [alertname]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: gmail
          matchers:
            - alertname="BrevoDeliveryConfirmationOverdue"
        - receiver: gmail
          matchers:
            - alertname="RedisRateLimiterFailOpen"
    receivers:
      - name: discard
      - name: gmail
        email_configs:
          - to: arorakanan63@gmail.com
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: gmail-password
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: gmail-password
          secret:
            secretName: alertmanager-gmail
            defaultMode: 0440
            items:
              - key: alertmanager_gmail_app_password
                path: alertmanager_gmail_app_password
        - name: data
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: notification-service
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - port: 9093
      targetPort: http
  type: ClusterIP
