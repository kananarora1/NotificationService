apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: notification-service
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    scrape_configs:
      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["notification-service:80"]
  alerts.yml: |
    groups:
      - name: notification-service-delivery
        rules:
          - alert: BrevoDeliveryConfirmationOverdue
            expr: max(notifications_overdue_confirmation) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Brevo delivery confirmation is overdue"
              description: >-
                {{ $value | printf "%.0f" }} notification(s) have waited over 30 minutes
                since Brevo accepted them without a delivery or permanent-failure webhook.
                Check Brevo webhook configuration and delivery logs. Do not resend
                automatically: Brevo may already have delivered them.
      - name: notification-service-rate-limiter
        rules:
          - alert: RedisRateLimiterFailOpen
            expr: sum(increase(ratelimit_fail_open_total[5m])) >= 3
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Notification requests are bypassing rate limits"
              description: >-
                {{ $value | printf "%.0f" }} requests bypassed rate limiting in the last
                5 minutes because Redis calls failed. Check Redis and its connection
                from the application. Requests are still being accepted.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=256MB
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: notification-service
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - port: 9090
      targetPort: http
  type: ClusterIP
